<script>
        const PASSWORD_OPERATOR = "w1ll14m5"; 
        const LIMIT_DATA = 10;
        let pageKaryawan = 1;
        let pageAbsen = 1;

        // --- SISTEM INDEXEDDB UNTUK PULUHAN RIBU DATA ---
        let db;
        const dbName = "PalmaPertiwiDB";
        const dbVersion = 1;

        const dbRequest = indexedDB.open(dbName, dbVersion);

        dbRequest.onerror = function(event) {
            console.error("Gagal membuka IndexedDB", event);
            alert("Gagal menginisialisasi database browser.");
        };

        dbRequest.onsuccess = function(event) {
            db = event.target.result;
            inisialisasiDataAwal();
        };

        dbRequest.onupgradeneeded = function(event) {
            db = event.target.result;
            if (!db.objectStoreNames.contains("karyawan")) {
                const storeKaryawan = db.createObjectStore("karyawan", { keyPath: "id", autoIncrement: true });
                storeKaryawan.createIndex("nik", "nik", { unique: false });
                storeKaryawan.createIndex("id_karyawan", "id_karyawan", { unique: false });
            }
            if (!db.objectStoreNames.contains("riwayat")) {
                const storeRiwayat = db.createObjectStore("riwayat", { keyPath: "id", autoIncrement: true });
                storeRiwayat.createIndex("tanggal", "tanggal", { unique: false });
            }
        };

        function inisialisasiDataAwal() {
            const transaction = db.transaction(["karyawan"], "readonly");
            const store = transaction.objectStore("karyawan");
            const countRequest = store.count();

            countRequest.onsuccess = function() {
                if (countRequest.result === 0) {
                    const transWrite = db.transaction(["karyawan"], "readwrite");
                    const storeWrite = transWrite.objectStore("karyawan");
                    storeWrite.add({ 
                        nik: "9171031702930002", 
                        id_karyawan: "26TKS017", 
                        nama: "Fernando Williams Edison Sanggenafa, ST.", 
                        foto: "" 
                    });
                    transWrite.oncomplete = function() {
                        muatDaftarKaryawan();
                    };
                } else {
                    muatDaftarKaryawan();
                }
            };
            muatRiwayat();
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        let html5QrCode = null;
        let saatIniFacingMode = "environment"; // Default kamera belakang

        window.addEventListener('DOMContentLoaded', () => {
            cekStatusPerangkat();
        });

        function cekStatusPerangkat() {
            const officialToken = localStorage.getItem('OFFICIAL_DEVICE_TOKEN');
            const alertBox = document.getElementById('device-alert');
            const resultDiv = document.getElementById('scan-result');
            const scannerWrapper = document.getElementById('scanner-wrapper');

            if (!officialToken) {
                alertBox.className = "mb-3 p-2 rounded text-xs font-semibold text-center bg-red-100 text-red-700";
                alertBox.innerText = "⚠️ PERINGATAN: Perangkat ini belum diaktifkan sebagai terminal resmi!";
                alertBox.classList.remove('hidden');

                resultDiv.innerHTML = "❌ Scanner terkunci. Harap hubungi operator untuk aktivasi di menu Perangkat.";
                scannerWrapper.classList.add('opacity-50', 'pointer-events-none');
                document.getElementById('device-info-box').innerHTML = "<b>Status:</b> Belum Terdaftar.";
            } else {
                alertBox.className = "mb-3 p-2 rounded text-xs font-semibold text-center bg-green-100 text-green-700";
                alertBox.innerText = "✔️ Perangkat Publik Siap Digunakan untuk Absensi.";
                alertBox.classList.remove('hidden');

                scannerWrapper.classList.remove('opacity-50', 'pointer-events-none');
                document.getElementById('device-info-box').innerHTML = `<b>Status:</b> Aktif<br><span class="text-[10px] text-gray-400">Token: ${officialToken}</span>`;
                
                // Inisialisasi Scanner Kamera setelah status perangkat valid
                inisialisasiKamera();
            }
        }

        function validasiAkses(tab) {
            const inputPass = prompt("🔒 Masukan Password Operator:");
            if (inputPass === null) return;

            if (inputPass === PASSWORD_OPERATOR) {
                gantiTab(tab);
            } else {
                alert("❌ Password salah! Anda tidak memiliki hak akses ke menu operator.");
            }
        }

        function daftarkanPerangkatIni() {
            const newToken = "DEV-PALMA-" + Math.random().toString(36).substring(2, 9).toUpperCase();
            localStorage.setItem('OFFICIAL_DEVICE_TOKEN', newToken);
            alert("Perangkat berhasil diaktifkan sebagai terminal resmi!");
            location.reload();
        }

        function resetPerangkat() {
            if (confirm("Yakin ingin melepas perangkat ini?")) {
                localStorage.removeItem('OFFICIAL_DEVICE_TOKEN');
                alert("Perangkat berhasil dilepas.");
                location.reload();
            }
        }

        function gantiTab(tab) {
            const tabs = ['scan', 'karyawan', 'absen', 'device'];
            tabs.forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('btn-' + t).className = "py-2 bg-gray-200 text-gray-700 rounded-lg text-[11px] font-medium";
            });

            document.getElementById('tab-' + tab).classList.remove('hidden');
            document.getElementById('btn-' + tab).className = "py-2 bg-blue-600 text-white rounded-lg text-[11px] font-medium shadow";

            if (tab === 'karyawan') muatDaftarKaryawan();
            if (tab === 'absen') muatRiwayat();
        }

        function evaluasiAbsensi(jamStr) {
            const jam = jamStr.substring(0, 5);

            if (jam >= "06:30" && jam <= "07:30") {
                return { jenis: "Masuk", status: "Tepat Waktu (Masuk)" };
            } else if (jam > "07:30" && jam <= "11:59") {
                return { jenis: "Masuk", status: "Terlambat (Masuk)" };
            } else if (jam >= "12:00" && jam <= "13:00") {
                return { jenis: "Kembali Istirahat", status: "Tepat Waktu (Istirahat)" };
            } else if (jam > "13:00" && jam <= "14:59") {
                return { jenis: "Kembali Istirahat", status: "Terlambat (Istirahat)" };
            } else if (jam >= "15:00" && jam <= "16:00") {
                return { jenis: "Pulang", status: "Pulang Tepat Waktu" };
            } else if (jam > "16:00") {
                return { jenis: "Pulang", status: "Lembur" };
            } else {
                return { jenis: "Diluar Jam", status: "Diluar Jadwal" };
            }
        }

        let lastScanTime = 0;
        let lastScanId = "";

        // --- FUNGSI UTAMA PEMROSESAN QR CODE (SCAN SUCCESS) ---
        function onScanSuccess(decodedText, decodedResult) {
            if (!localStorage.getItem('OFFICIAL_DEVICE_TOKEN')) {
                alert("Absen ditolak! Perangkat belum resmi.");
                return;
            }

            const currentTime = new Date().getTime();
            if (decodedText === lastScanId && (currentTime - lastScanTime < 5000)) {
                return; 
            }

            const parts = decodedText.split('|');
            const nikScan = parts[0];
            const idScan = parts[1];
            const resultDiv = document.getElementById('scan-result');

            if (!db) {
                resultDiv.innerHTML = `<span class="text-red-600">❌ Database belum siap!</span>`;
                return;
            }

            // Ambil data karyawan terlebih dahulu secara aman
            const transKaryawan = db.transaction(["karyawan"], "readonly");
            const storeKaryawan = transKaryawan.objectStore("karyawan");
            const reqKaryawan = storeKaryawan.getAll();

            reqKaryawan.onsuccess = function(eKaryawan) {
                const listKaryawan = eKaryawan.target.result;
                const karyawan = listKaryawan.find(k => k.nik === nikScan || k.id_karyawan === idScan);

                if (!karyawan) {
                    resultDiv.innerHTML = `<span class="text-red-600">❌ Karyawan tidak dikenali! Data: ${decodedText}</span>`;
                    return;
                }

                const now = new Date();
                const jamString = now.toTimeString().split(' ')[0];
                const tanggalString = now.toISOString().split('T')[0];
                const hasilAturan = evaluasiAbsensi(jamString);

                // Cek riwayat absensi pada hari dan sesi yang sama
                const transRiwayatCheck = db.transaction(["riwayat"], "readonly");
                const storeRiwayatCheck = transRiwayatCheck.objectStore("riwayat");
                const reqRiwayat = storeRiwayatCheck.getAll();

                reqRiwayat.onsuccess = function(eRiwayat) {
                    const riwayatList = eRiwayat.target.result;
                    const sudahAbsenSesiIni = riwayatList.find(r => r.nik === karyawan.nik && r.tanggal === tanggalString && r.jenis === hasilAturan.jenis);

                    if (sudahAbsenSesiIni) {
                        lastScanTime = currentTime;
                        lastScanId = decodedText;
                        resultDiv.innerHTML = `<span class="text-amber-600 font-bold">⚠️ ${karyawan.nama} sudah melakukan absen (${hasilAturan.jenis}) hari ini!</span><br><span class="text-xs text-gray-500">Absen kedua ditolak untuk mencegah penumpukan data.</span>`;
                        return;
                    }

                    // Simpan data absensi baru ke database
                    const transWrite = db.transaction(["riwayat"], "readwrite");
                    const storeWrite = transWrite.objectStore("riwayat");
                    
                    const addReq = storeWrite.add({
                        nama: karyawan.nama,
                        id: karyawan.id_karyawan,
                        nik: karyawan.nik,
                        tanggal: tanggalString,
                        jam: jamString,
                        jenis: hasilAturan.jenis,
                        status: hasilAturan.status
                    });

                    addReq.onsuccess = function() {
                        lastScanTime = currentTime;
                        lastScanId = decodedText;
                        resultDiv.innerHTML = `<span class="text-green-600 font-bold">✅ Berhasil Absen: ${karyawan.nama}</span><br><span class="text-xs text-gray-500">${hasilAturan.jenis} - ${hasilAturan.status} (${jamString})</span>`;
                        muatRiwayat();
                    };

                    addReq.onerror = function(err) {
                        console.error("Gagal menyimpan riwayat absen:", err);
                        resultDiv.innerHTML = `<span class="text-red-600">❌ Gagal menyimpan ke database.</span>`;
                    };
                };
            };
        }

        // --- PENGELOLAAN KAMERA & DROPDOWN ---
        function inisialisasiKamera() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            Html5Qrcode.getCameras().then(devices => {
                const selectElem = document.getElementById('camera-select');
                if (devices && devices.length > 0) {
                    selectElem.innerHTML = '';
                    devices.forEach((device, index) => {
                        const option = document.createElement('option');
                        option.value = device.id;
                        option.text = device.label || `Kamera ${index + 1}`;
                        selectElem.appendChild(option);
                    });

                    jalankanScanner({ deviceId: { exact: selectElem.value } });

                    selectElem.onchange = function() {
                        hentikanDanJalankanKamera({ deviceId: { exact: this.value } });
                    };
                } else {
                    jalankanScanner({ facingMode: saatIniFacingMode });
                }
            }).catch(err => {
                console.warn("Gagal mendapatkan daftar kamera, menggunakan mode fallback:", err);
                jalankanScanner({ facingMode: saatIniFacingMode });
            });
        }

        function jalankanScanner(cameraConfig) {
            const config = { fps: 10, qrbox: 200 };
            
            html5QrCode.start(cameraConfig, config, onScanSuccess)
            .then(() => {
                document.getElementById('scan-result').innerHTML = 
                    `<span class="text-green-600 font-semibold">✅ Perangkat Siap. Arahkan Barcode!</span>`;
            })
            .catch(err => {
                console.error("Gagal membuka kamera:", err);
                document.getElementById('scan-result').innerHTML = 
                    `<span class="text-red-600">❌ Gagal membuka kamera: ${err}</span>`;
            });
        }

        function hentikanDanJalankanKamera(cameraConfig) {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    jalankanScanner(cameraConfig);
                }).catch(err => console.error("Gagal menghentikan kamera:", err));
            } else {
                jalankanScanner(cameraConfig);
            }
        }

        function tukarKameraManual() {
            saatIniFacingMode = (saatIniFacingMode === "environment") ? "user" : "environment";
            hentikanDanJalankanKamera({ facingMode: saatIniFacingMode });
        }

        function tambahDanGenerate() {
            const nik = document.getElementById('input-nik').value;
            const id = document.getElementById('input-id').value;
            const nama = document.getElementById('input-nama').value;
            const fileInput = document.getElementById('input-foto');

            if(!nik || !id || !nama) {
                alert("NIK, ID, dan Nama wajib diisi!");
                return;
            }

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    kompresDanSimpanKaryawan(nik, id, nama, e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                simpanDataKaryawan(nik, id, nama, "");
            }
        }

        function kompresDanSimpanKaryawan(nik, id, nama, dataUrl) {
            const img = new Image();
            img.src = dataUrl;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 200;
                const MAX_HEIGHT = 250;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                } else {
                    if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                simpanDataKaryawan(nik, id, nama, canvas.toDataURL('image/jpeg', 0.7));
            };
        }

        function simpanDataKaryawan(nik, id, nama, foto) {
            if (!db) return;
            const transaction = db.transaction(["karyawan"], "readwrite");
            const store = transaction.objectStore("karyawan");
            
            store.add({ nik, id_karyawan: id, nama, foto });

            transaction.oncomplete = function() {
                tampilkanKartu(nik, id, nama, foto);
                alert("Karyawan berhasil disimpan!");
                document.getElementById('input-nik').value = '';
                document.getElementById('input-id').value = '';
                document.getElementById('input-nama').value = '';
                document.getElementById('input-foto').value = '';
                muatDaftarKaryawan();
            };
        }

        function gantiFotoKaryawan(idKey, inputElement) {
            if (inputElement.files && inputElement.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = 200;
                        canvas.height = 250;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, 200, 250);
                        const compressed = canvas.toDataURL('image/jpeg', 0.7);

                        const transaction = db.transaction(["karyawan"], "readwrite");
                        const store = transaction.objectStore("karyawan");
                        const getReq = store.get(idKey);

                        getReq.onsuccess = function() {
                            let karyawan = getReq.result;
                            karyawan.foto = compressed;
                            store.put(karyawan);

                            transaction.oncomplete = function() {
                                alert("Foto berhasil diperbarui!");
                                muatDaftarKaryawan();
                                tampilkanKartu(karyawan.nik, karyawan.id_karyawan, karyawan.nama, karyawan.foto);
                            };
                        };
                    };
                };
                reader.readAsDataURL(inputElement.files[0]);
            }
        }

        function tampilkanKartu(nik, id, nama, foto) {
            const teksQr = nik + "|" + id;

            document.getElementById('container-qrcode').classList.remove('hidden');
            document.getElementById('preview-nama').innerText = nama;
            document.getElementById('preview-id').innerText = "ID: " + id;
            document.getElementById('preview-nik').innerText = "NIK: " + nik;

            const imgEl = document.getElementById('preview-foto');
            const noFotoEl = document.getElementById('preview-no-foto');

            if (foto && foto.trim() !== "") {
                imgEl.src = foto;
                imgEl.style.display = "block";
                noFotoEl.style.display = "none";
            } else {
                imgEl.style.display = "none";
                noFotoEl.style.display = "flex";
            }
            
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: teksQr,
                width: 120,
                height: 120
            });
        }

        function downloadIDCardPNG() {
            const cardContainer = document.getElementById('id-card-preview');
            const namaKaryawan = document.getElementById('preview-nama').innerText || "Karyawan";

            html2canvas(cardContainer, {
                scale: 3,
                useCORS: true,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const imageURI = canvas.toDataURL("image/png");
                const downloadLink = document.createElement("a");
                downloadLink.href = imageURI;
                downloadLink.download = "ID_Card_" + namaKaryawan.replace(/[^a-zA-Z0-9]/g, "_") + ".png";
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            });
        }

        function muatDaftarKaryawan() {
            if (!db) return;
            const transaction = db.transaction(["karyawan"], "readonly");
            const store = transaction.objectStore("karyawan");
            store.getAll().onsuccess = function(e) {
                const listKaryawan = e.target.result;
                const container = document.getElementById('list-db-karyawan');
                const keyword = document.getElementById('search-karyawan').value.toLowerCase();

                const filtered = listKaryawan.filter(k => 
                    k.nik.toLowerCase().includes(keyword) || 
                    k.id_karyawan.toLowerCase().includes(keyword) || 
                    k.nama.toLowerCase().includes(keyword)
                );

                const totalPage = Math.ceil(filtered.length / LIMIT_DATA) || 1;
                if (pageKaryawan > totalPage) pageKaryawan = totalPage;
                if (pageKaryawan < 1) pageKaryawan = 1;

                const start = (pageKaryawan - 1) * LIMIT_DATA;
                const paginatedData = filtered.slice(start, start + LIMIT_DATA);

                document.getElementById('page-info-karyawan').innerText = `Hal ${pageKaryawan} dari ${totalPage}`;
                document.getElementById('btn-prev-karyawan').disabled = pageKaryawan === 1;
                document.getElementById('btn-next-karyawan').disabled = pageKaryawan === totalPage;

                if (paginatedData.length === 0) {
                    container.innerHTML = "<div class='text-center py-4 text-gray-400'>Karyawan tidak ditemukan.</div>";
                    return;
                }

                let html = "";
                paginatedData.forEach((k) => {
                    const fotoThumbnail = k.foto ? `<img src="${k.foto}" class="w-8 h-10 object-cover rounded border">` : `<div class="w-8 h-10 bg-gray-200 rounded flex items-center justify-center text-[9px] text-gray-400">No</div>`;
                    
                    html += `<div class="p-2 bg-gray-50 border rounded flex justify-between items-center hover:bg-blue-50 transition mb-1">
                        <div onclick="tampilkanKartu('${k.nik}', '${k.id_karyawan}', '${k.nama}', '${k.foto || ''}')" class="cursor-pointer flex items-center space-x-2 flex-1">
                            ${fotoThumbnail}
                            <div>
                                <strong class="text-blue-900 underline text-xs">${k.nama}</strong><br>
                                <span class="text-gray-500 text-[10px]">ID: ${k.id_karyawan} | NIK: ${k.nik}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1">
                            <label class="cursor-pointer bg-blue-50 text-blue-700 border border-blue-200 px-2 py-1 rounded text-[10px] font-semibold hover:bg-blue-100">
                                📷 Ganti
                                <input type="file" accept="image/*" class="hidden" onchange="gantiFotoKaryawan(${k.id}, this)">
                            </label>
                            <button onclick="hapusKaryawan(${k.id})" class="text-red-600 font-bold px-2 py-1 text-[10px] bg-red-50 rounded border border-red-200 hover:bg-red-100">Hapus</button>
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
            };
        }

        function gantiHalamanKaryawan(dir) {
            pageKaryawan += dir;
            muatDaftarKaryawan();
        }

        function hapusKaryawan(idKey) {
            if (confirm("Hapus data karyawan ini?")) {
                const transaction = db.transaction(["karyawan"], "readwrite");
                const store = transaction.objectStore("karyawan");
                store.delete(idKey);
                transaction.oncomplete = function() {
                    muatDaftarKaryawan();
                };
            }
        }

        function muatRiwayat() {
            if (!db) return;
            const transaction = db.transaction(["riwayat"], "readonly");
            const store = transaction.objectStore("riwayat");
            store.getAll().onsuccess = function(e) {
                const riwayat = e.target.result.reverse();
                const container = document.getElementById('list-riwayat');
                const keyword = document.getElementById('search-absen').value.toLowerCase();

                const filtered = riwayat.filter(r => 
                    r.nik.toLowerCase().includes(keyword) || 
                    r.id.toLowerCase().includes(keyword) || 
                    r.nama.toLowerCase().includes(keyword) ||
                    r.tanggal.toLowerCase().includes(keyword)
                );
                
                const totalPage = Math.ceil(filtered.length / LIMIT_DATA) || 1;
                if (pageAbsen > totalPage) pageAbsen = totalPage;
                if (pageAbsen < 1) pageAbsen = 1;

                const start = (pageAbsen - 1) * LIMIT_DATA;
                const paginatedData = filtered.slice(start, start + LIMIT_DATA);

                document.getElementById('page-info-absen').innerText = `Hal ${pageAbsen} dari ${totalPage}`;
                document.getElementById('btn-prev-absen').disabled = pageAbsen === 1;
                document.getElementById('btn-next-absen').disabled = pageAbsen === totalPage;

                if (paginatedData.length === 0) {
                    container.innerHTML = "<div class='text-center py-4 text-gray-400'>Riwayat absensi tidak ditemukan.</div>";
                    return;
                }

                let html = "";
                paginatedData.forEach(r => {
                    html += `<div class="p-2 bg-gray-50 border rounded mb-1">
                        <b>${r.nama}</b> (${r.id})<br>
                        <span class="text-blue-600">${r.jenis}</span> | Status: <span class="font-semibold">${r.status}</span><br>
                        <span class="text-gray-400 text-[10px]">${r.tanggal} ${r.jam} | NIK: ${r.nik}</span>
                    </div>`;
                });
                container.innerHTML = html;
            };
        }

        function gantiHalamanAbsen(dir) {
            pageAbsen += dir;
            muatRiwayat();
        }

        // --- MASTER LAPORAN REKAP HARIAN OTOMATIS UNTUK BENDAHARA ---
        function exportKeExcelRapi() {
            if (!db) {
                alert("Database belum siap!");
                return;
            }

            const transaction = db.transaction(["riwayat"], "readonly");
            const store = transaction.objectStore("riwayat");

            store.getAll().onsuccess = function(e) {
                const riwayat = e.target.result || [];
                if (riwayat.length === 0) {
                    alert("Belum ada data absensi untuk diexport!");
                    return;
                }

                const masterMap = {};
                riwayat.forEach(r => {
                    const kunci = r.tanggal + "_" + r.nik;
                    if (!masterMap[kunci]) {
                        masterMap[kunci] = {
                            tanggal: r.tanggal,
                            id: r.id,
                            nik: r.nik,
                            nama: r.nama,
                            masuk: "-",
                            statusMasuk: "-",
                            istirahat: "-",
                            statusIstirahat: "-",
                            pulang: "-",
                            statusPulang: "-"
                        };
                    }
                    if (r.jenis === "Masuk") {
                        masterMap[kunci].masuk = r.jam;
                        masterMap[kunci].statusMasuk = r.status;
                    } else if (r.jenis === "Kembali Istirahat") {
                        masterMap[kunci].istirahat = r.jam;
                        masterMap[kunci].statusIstirahat = r.status;
                    } else if (r.jenis === "Pulang") {
                        masterMap[kunci].pulang = r.jam;
                        masterMap[kunci].statusPulang = r.status;
                    }
                });

                const dataMaster = Object.values(masterMap);

                let excelTemplate = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head>
                    <meta charset="utf-8">
                    <!--[if gte mso 9]>
                    <xml>
                        <x:ExcelWorkbook>
                            <x:ExcelWorksheets>
                                <x:ExcelWorksheet>
                                    <x:Name>Master Rekap Absensi</x:Name>
                                    <x:WorksheetOptions>
                                        <x:DisplayGridlines/>
                                    </x:WorksheetOptions>
                                </x:ExcelWorksheet>
                            </x:ExcelWorksheets>
                        </x:ExcelWorkbook>
                    </xml>
                    <![endif]-->
                    <style>
                        th {
                            background-color: #2563eb;
                            color: #ffffff;
                            font-weight: bold;
                            text-align: center;
                            vertical-align: middle;
                            height: 35px;
                            border: 1px solid #1e40af;
                            padding: 5px 15px;
                            font-family: Arial, sans-serif;
                            font-size: 11pt;
                        }
                        td {
                            vertical-align: middle;
                            border: 1px solid #d1d5db;
                            padding: 6px 12px;
                            font-family: Arial, sans-serif;
                            font-size: 10pt;
                            white-space: nowrap;
                        }
                        .text-center { text-align: center; }
                        .text-left { text-align: left; }
                        .str { mso-number-format: "\\@"; }
                    </style>
                </head>
                <body>
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 110px;">Tanggal</th>
                                <th style="width: 100px;">ID Karyawan</th>
                                <th style="width: 170px;">NIK</th>
                                <th style="width: 230px;">Nama Karyawan</th>
                                <th style="width: 90px;">Jam Masuk</th>
                                <th style="width: 160px;">Status Masuk</th>
                                <th style="width: 100px;">Jam Istirahat</th>
                                <th style="width: 160px;">Status Istirahat</th>
                                <th style="width: 90px;">Jam Pulang</th>
                                <th style="width: 160px;">Status Pulang</th>
                            </tr>
                        </thead>
                        <tbody>`;

                dataMaster.forEach(m => {
                    excelTemplate += `
                            <tr>
                                <td class="text-center str">${m.tanggal}</td>
                                <td class="text-center str">${m.id}</td>
                                <td class="text-center str">&nbsp;${m.nik}</td>
                                <td class="text-left">${m.nama}</td>
                                <td class="text-center str">${m.masuk}</td>
                                <td class="text-center">${m.statusMasuk}</td>
                                <td class="text-center str">${m.istirahat}</td>
                                <td class="text-center">${m.statusIstirahat}</td>
                                <td class="text-center str">${m.pulang}</td>
                                <td class="text-center">${m.statusPulang}</td>
                            </tr>`;
                });

                excelTemplate += `
                        </tbody>
                    </table>
                </body>
                </html>`;

                const blob = new Blob([excelTemplate], { type: 'application/vnd.ms-excel;charset=utf-8' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "Master_Rekap_Absensi_" + new Date().toISOString().split('T')[0] + ".xls";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };
        }
    </script>
